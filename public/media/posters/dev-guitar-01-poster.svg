<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE8F4" />
      <stop offset="100%" stop-color="#FFF8F0" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="384" height="344" rx="20" fill="url(#bg)" stroke="#24252B" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Decorative Corner Tape -->
  <rect x="20" y="10" width="70" height="22" rx="4" fill="#F6E7B8" opacity="0.85" transform="rotate(-6 55 21)"/>
  <rect x="310" y="14" width="70" height="22" rx="4" fill="#E9A8B0" opacity="0.65" transform="rotate(6 345 25)"/>

  <!-- Category Tag -->
  <g transform="translate(30, 48)">
    <rect width="90" height="24" rx="12" fill="#24252B" fill-opacity="0.07"/>
    <text x="45" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#24252B" text-anchor="middle" letter-spacing="1">MUSIC CLIP</text>
  </g>

  <!-- Central Icon Graphic -->
  <g opacity="0.9">
    
      <circle cx="170" cy="190" r="20" fill="#765747"/>
      <circle cx="230" cy="175" r="20" fill="#765747"/>
      <line x1="188" y1="190" x2="188" y2="120" stroke="#765747" stroke-width="6"/>
      <line x1="248" y1="175" x2="248" y2="105" stroke="#765747" stroke-width="6"/>
      <polygon points="188,125 250,110 250,125 188,140" fill="#765747"/>
    
  </g>

  <!-- Title & Details -->
  <text x="200" y="270" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#24252B" text-anchor="middle">Acoustic in Progress</text>
  <text x="200" y="296" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#765747" text-anchor="middle">Chord switches & practice session</text>

  <!-- Bottom Badge -->
  <rect x="80" y="314" width="240" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.9" stroke="#24252B" stroke-opacity="0.06"/>
  <text x="200" y="329" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#737686" text-anchor="middle">📷 DEV's PHOTO / MEDIA PLACEHOLDER</text>
</svg>